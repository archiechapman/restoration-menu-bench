[package]
name = "rop-deflate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hamming deflation loop on microlp, for the Restoration Menu Bench"
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
microlp = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
